name: FTP Deploy

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  NODE_VERSION: '20'  # Node 20 LTS for Astro compatibility

jobs:
  build-and-deploy:
    name: 🚀 Build & Deploy via FTP
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v4

    - name: 🟢 Setup Node.js ${{ env.NODE_VERSION }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: 📦 Install dependencies
      run: npm ci --prefer-offline --no-audit

    - name: 🏗️ Build Astro site
      run: npm run build

    - name: ✅ Verify build output
      run: |
        if [ ! -d "dist" ]; then
          echo "❌ Build failed: 'dist' directory not found"
          exit 1
        fi
        echo "✅ Build successful: $(du -sh dist | cut -f1) generated"
        echo "📊 Files count: $(find dist -type f | wc -l)"

    - name: 🚀 Deploy to FTP Server
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./dist/
        server-dir: /
        dangerous-clean-slate: false
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**
          **/.astro/**
        log-level: verbose
        dry-run: false

    - name: ✅ Deployment verification
      run: |
        echo "✅ Deployment completed successfully!"
        echo "🌐 Your site should be live at https://hekyhomes.com"

