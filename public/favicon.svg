<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
	<!-- Background Circle -->
	<circle cx="64" cy="64" r="60" fill="#2337ff"/>
	
	<!-- House Icon -->
	<g transform="translate(34, 28)">
		<!-- Roof -->
		<path d="M 0 30 L 30 5 L 60 30 Z" fill="white"/>
		<!-- House Body -->
		<rect x="5" y="30" width="50" height="45" fill="white"/>
		<!-- Door -->
		<rect x="22" y="50" width="16" height="25" fill="#2337ff"/>
		<!-- Door knob -->
		<circle cx="32" cy="62" r="2" fill="white"/>
		<!-- Left Window -->
		<rect x="12" y="38" width="12" height="10" fill="#2337ff"/>
		<line x1="18" y1="38" x2="18" y2="48" stroke="white" stroke-width="1.5"/>
		<line x1="12" y1="43" x2="24" y2="43" stroke="white" stroke-width="1.5"/>
		<!-- Right Window -->
		<rect x="36" y="38" width="12" height="10" fill="#2337ff"/>
		<line x1="42" y1="38" x2="42" y2="48" stroke="white" stroke-width="1.5"/>
		<line x1="36" y1="43" x2="48" y2="43" stroke="white" stroke-width="1.5"/>
		<!-- Chimney -->
		<rect x="45" y="15" width="6" height="15" fill="white"/>
		<rect x="43" y="15" width="10" height="3" fill="white"/>
	</g>
	
	<style>
		@media (prefers-color-scheme: dark) {
			circle { fill: #000d8a; }
		}
	</style>
</svg>
